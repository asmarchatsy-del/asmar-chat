name: One-time remove legacy VIP

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-vip:
    if: ${{ !contains(github.event.head_commit.message, '[vip-removal-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove legacy VIP UI and code paths
        shell: python
        run: |
          from pathlib import Path
          import re

          main = Path('lib/main.dart')
          s = main.read_text(encoding='utf-8')

          s = s.replace("import 'vip.dart';\n", '')
          s = s.replace("مجتمع صوتي • غرف • هدايا • VIP", "مجتمع صوتي • غرف • هدايا • SVIP")
          s = s.replace("select('username,role,country_code,vip_level,svip_level,public_id,avatar_url,avatar_is_animated,activity_admin_badge,customer_service_badge,is_verified,coins')", "select('username,role,country_code,svip_level,public_id,avatar_url,avatar_is_animated,activity_admin_badge,customer_service_badge,is_verified,coins')")
          s = s.replace("          final vip = p['vip_level']?.toString();\n", '')
          s = s.replace("                      vip: vip,\n", '')
          s = s.replace("  final String? vip;\n", '')
          s = s.replace("    required this.vip,\n", '')

          old_membership = '''                  // VIP / SVIP / محفظة الكوينز — تحت صورة البروفايل\n                  SliverToBoxAdapter(\n                    child: Padding(\n                      padding: const EdgeInsets.symmetric(horizontal: 12),\n                      child: Row(\n                        children: [\n                          Expanded(\n                            child: _SimpleMembershipCard(\n                              title: svipLevel > 0 ? 'SVIP $svipLevel' : 'SVIP',\n                              subtitle: svipLevel > 0 ? 'العضوية الحالية' : 'غير مفعّل',\n                              icon: Icons.diamond_outlined,\n                              onTap: () => _info('SVIP — معلومات العضوية'),\n                            ),\n                          ),\n                          const SizedBox(width: 6),\n                          Expanded(\n                            child: _SimpleMembershipCard(\n                              title: vip == null || vip.isEmpty ? 'VIP' : vip,\n                              subtitle: 'العضوية الحالية',\n                              icon: Icons.workspace_premium_outlined,\n                              onTap: () => Navigator.push(\n                                context,\n                                MaterialPageRoute(builder: (_) => const VipPage()),\n                              ),\n                            ),\n                          ),\n                          const SizedBox(width: 6),\n                          Expanded(\n                            child: _SimpleMembershipCard(\n                              title: coins.toString(),\n                              subtitle: 'محفظة الكوينز',\n                              icon: Icons.account_balance_wallet_outlined,\n                              onTap: () => Navigator.push(\n                                context,\n                                MaterialPageRoute(builder: (_) => const WalletPage()),\n                              ),\n                            ),\n                          ),\n                        ],\n                      ),\n                    ),\n                  ),'''
          new_membership = '''                  // SVIP + محفظة الكوينز — تحت صورة البروفايل\n                  SliverToBoxAdapter(\n                    child: Padding(\n                      padding: const EdgeInsets.symmetric(horizontal: 12),\n                      child: Row(\n                        children: [\n                          Expanded(\n                            child: _SimpleMembershipCard(\n                              title: svipLevel > 0 ? 'SVIP $svipLevel' : 'SVIP',\n                              subtitle: svipLevel > 0 ? 'العضوية الحالية' : 'غير مفعّل',\n                              icon: Icons.diamond_outlined,\n                              onTap: () => _info('SVIP — معلومات العضوية'),\n                            ),\n                          ),\n                          const SizedBox(width: 6),\n                          Expanded(\n                            child: _SimpleMembershipCard(\n                              title: coins.toString(),\n                              subtitle: 'محفظة الكوينز',\n                              icon: Icons.account_balance_wallet_outlined,\n                              onTap: () => Navigator.push(\n                                context,\n                                MaterialPageRoute(builder: (_) => const WalletPage()),\n                              ),\n                            ),\n                          ),\n                        ],\n                      ),\n                    ),\n                  ),'''
          if old_membership not in s:
              raise SystemExit('Expected profile membership block not found')
          s = s.replace(old_membership, new_membership)

          old_level = '''                        _ProfileMenuTile(\n                          'المستوى',\n                          Icons.star,\n                          () => Navigator.push(\n                            context,\n                            MaterialPageRoute(\n                              builder: (_) => const VipPage(),\n                            ),\n                          ),\n                        ),'''
          new_level = '''                        _ProfileMenuTile(\n                          'SVIP',\n                          Icons.diamond_outlined,\n                          () => Navigator.push(\n                            context,\n                            MaterialPageRoute(\n                              builder: (_) => const SvipPage(),\n                            ),\n                          ),\n                        ),'''
          if old_level not in s:
              raise SystemExit('Expected level menu block not found')
          s = s.replace(old_level, new_level)

          old_identity = '''          Text(\n            vip != null && vip!.isNotEmpty\n                ? vip!\n                : (role == 'AGENT' ? 'COIN SELLER' : role),\n            style: const TextStyle(\n              color: gold,\n              fontSize: 12,\n              fontWeight: FontWeight.w900,\n              letterSpacing: 1,\n            ),\n          ),'''
          new_identity = '''          Text(\n            role == 'AGENT' ? 'COIN SELLER' : role,\n            style: const TextStyle(\n              color: gold,\n              fontSize: 12,\n              fontWeight: FontWeight.w900,\n              letterSpacing: 1,\n            ),\n          ),'''
          if old_identity not in s:
              raise SystemExit('Expected profile identity label not found')
          s = s.replace(old_identity, new_identity)

          main.write_text(s, encoding='utf-8')

          # Keep RankFrame's public API stable but remove its VIP-specific runtime branch.
          rf = Path('lib/rank_frame.dart')
          r = rf.read_text(encoding='utf-8')
          vip_branch = '''      } else {\n        final vip = int.tryParse((widget.vipLevel ?? '').replaceAll(RegExp(r'[^0-9]'), '')) ?? 0;\n        if (vip >= 7 && vip <= 10) {\n          final row = await db.from('vip_levels').select('image').eq('id', 'VIP$vip').maybeSingle();\n          if (!mounted || row == null) return;\n          setState(() { _remoteMediaUrl = row['image']?.toString(); _remoteGlow = true; _remoteMotion = true; });\n        }\n'''
          if vip_branch in r:
              r = r.replace(vip_branch, '      }\n')
          vip_style = re.compile(r"\n    if \(vip != null && vip\.startsWith\('VIP'\)\) \{.*?\n    \}\n    final role = rawRole\.toUpperCase\(\);", re.S)
          r2 = vip_style.sub("\n    final role = rawRole.toUpperCase();", r)
          if r2 == r:
              raise SystemExit('Expected RankFrame VIP style block not found')
          rf.write_text(r2, encoding='utf-8')

          vip_file = Path('lib/vip.dart')
          if vip_file.exists():
              vip_file.unlink()

      - name: Verify no active VIP references remain in app code
        run: |
          ! grep -RniE "import 'vip.dart'|VipPage|purchase_vip|vip_level" lib --include='*.dart'

      - name: Commit and remove this one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/main.dart lib/rank_frame.dart lib/vip.dart
          git rm --cached .github/workflows/one_time_remove_vip.yml || true
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Remove legacy VIP system [vip-removal-complete]"
          git push origin HEAD:main
