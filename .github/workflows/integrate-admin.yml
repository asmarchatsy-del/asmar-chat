name: Integrate Super Admin Access
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[admin-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate admin route and avatar trigger
        run: python3 tool/integrate_admin_access.py
      - name: Commit integration
        run: |
          git config user.name 'Asmar Chat Bot'
          git config user.email 'actions@github.com'
          if git diff --quiet; then
            echo 'Admin integration already present.'
            exit 0
          fi
          git add lib/me_page.dart lib/asmar_entry.dart
          git commit -m 'feat: integrate Super Admin access [admin-integrated]'
          git push
