name: Build Asmar Chat

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform without touching app source
        run: |
          rm -rf /tmp/asmar_flutter_template
          flutter create --platforms=android --project-name asmar_chat --no-pub /tmp/asmar_flutter_template
          cp -R /tmp/asmar_flutter_template/android ./android
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          deep_link = '''
              <intent-filter>
                  <action android:name="android.intent.action.VIEW" />
                  <category android:name="android.intent.category.DEFAULT" />
                  <category android:name="android.intent.category.BROWSABLE" />
                  <data android:scheme="io.supabase.flutter" android:host="login-callback" />
              </intent-filter>'''
          pattern = r'(<activity[^>]*android:name="\\.MainActivity"[^>]*>.*?</activity>)'
          m = re.search(pattern, s, re.S)
          if not m:
              raise SystemExit("MainActivity not found")
          block = m.group(1)
          if "io.supabase.flutter" not in block:
              block = block.replace("</activity>", deep_link + "\n          </activity>")
          p.write_text(s[:m.start()] + block + s[m.end():])
          PY

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      # Build one universal APK containing both ARM 32-bit and ARM 64-bit
      # native libraries. This avoids installing an incompatible split APK.
      - name: Build universal APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Verify universal APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          unzip -l build/app/outputs/flutter-apk/app-release.apk | grep -E 'lib/(armeabi-v7a|arm64-v8a)/'

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: asmar-chat-universal-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: asmar-chat-aab
          path: build/app/outputs/bundle/release/app-release.aab
