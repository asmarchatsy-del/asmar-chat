name: Build Asmar Chat

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: |
          flutter create --platforms=android.
          ls -la android/app/
      - name: Force exact Android package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          groovy=Path('android/app/build.gradle')
          kotlin=Path('android/app/build.gradle.kts')
          if groovy.exists():
              s=groovy.read_text(); s,n=re.subn(r'applicationId\s+["\'][^"\']+["\']','applicationId "com.asmarchat.app"',s,count=1)
              if n!=1: raise SystemExit('applicationId not found in build.gradle')
              groovy.write_text(s)
          elif kotlin.exists():
              s=kotlin.read_text(); s,n=re.subn(r'applicationId\s*=\s*"[^"]+"','applicationId = "com.asmarchat.app"',s,count=1)
              if n!=1: raise SystemExit('applicationId not found in build.gradle.kts')
              kotlin.write_text(s)
          else:
              raise SystemExit('Android Gradle file not found')
          PY
      - name: Apply Asmar Chat logo and branding
        run: python3 tool/apply_branding.py
      - name: Set Android app display name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(); s,n=re.subn(r'(<application\b[^>]*\bandroid:label=")[^"]*(")',r'\1Asmar Chat\2',s,count=1)
          if n!=1: raise SystemExit('Could not set Android application label')
          p.write_text(s
