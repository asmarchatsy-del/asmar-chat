name: بناء اسمر

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: سحب الكود
        uses: actions/checkout@v4

      - name: تثبيت Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.2'
          channel: 'stable'
          cache: true

      - name: تنظيف وتحميل المكتبات
        run: |
          flutter clean
          flutter pub get

      - name: تصليح مشكلة Agora compileSdk 33
        run: |
          # هذا السطر هو يلي كان يخلي البناء يفشل
          sed -i 's/compileSdkVersion 33/compileSdkVersion 34/g' android/app/build.gradle || true
          sed -i 's/compileSdk 33/compileSdk 34/g' android/app/build.gradle || true
          # تص
