name: Build Asmar Chat

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform without touching app source
        run: |
          rm -rf /tmp/asmar_flutter_template
          flutter create --platforms=android --project-name asmar_chat --no-pub /tmp/asmar_flutter_template
          cp -R /tmp/asmar_flutter_template/android ./android

      - name: Install Asmar Chat launcher icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          base64 -d tooling/app_icon.webp.b64 > android/app/src/main/res/drawable/app_icon.webp
          sed -i 's#@mipmap/ic_launcher#@drawable/app_icon#g' android/app/src/main/AndroidManifest.xml

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze || true

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asmar-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: asmar-chat-aab
          path: build/app/outputs/bundle/release/app-release.aab
