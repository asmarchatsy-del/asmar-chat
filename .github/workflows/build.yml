name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        working-directory: asmar_chat
        run: flutter pub get

      - name: Build APK
        working-directory: asmar_chat
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asmar-chat-apk
          path: asmar_chat/build/app/outputs/flutter-apk/app-release.apk
