name: Build Asmar Chat

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android platform without touching app source
        run: |
          rm -rf /tmp/asmar_flutter_template
          flutter create --platforms=android --project-name asmar_chat --no-pub /tmp/asmar_flutter_template
          cp -R /tmp/asmar_flutter_template/android ./android

      - name: Remove generated sample test
        run: rm -f test/widget_test.dart

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze || true

      - name: Build APKs per device architecture
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Verify arm64 APK
        run: |
          test -s build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          file build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: asmar-chat-apk-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: asmar-chat-aab
          path: build/app/outputs/bundle/release/app-release.aab
