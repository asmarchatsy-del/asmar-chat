name: Build Asmar Chat
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Analyze code
        run: flutter analyze --no-pub || true
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons --verbose
