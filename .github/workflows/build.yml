name: Build Asmar Chat
permissions:
  contents: write
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: flutter create --platforms=android.
      - name: Force exact Android package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p1=Path('android/app/build.gradle')
          p2=Path('android/app/build.gradle.kts')
          if p1.exists():
              s=p1.read_text()
              s=re.sub(r'applicationId\s+["\'][^"\']+["\']','applicationId "com.asmarchat.app"',s,count=1)
              p1.write_text(s)
          elif p2.exists():
              s=p2.read_text()
              s=re.sub(r'applicationId\s*=\s*"[^"]+"','applicationId = "com.asmarchat.app"',s,count=1)
              p2.write_text(s)
          PY
      - name: Apply branding
        run: python3 tool/apply_branding.py
      - name: Set app name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          s=re.sub(r'(<application\b[^>]*\bandroid:label=")[^"]*(")',r'\1Asmar Chat\2',s,count=1)
          p.write_text(s)
          PY
      - name: Clean and get deps
        run: |
          rm -f test/widget_test.dart
          flutter clean
          rm -rf build android/.gradle
          flutter pub get
      - name: Apply fixes
        run: |
          python3 tool/fix_release_runtime.py
          python3 tool/integrate_global_gift_bar.py
      - name: Build APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          flutter build apk --release -t lib/asmar_entry.dart --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/asmar-chat-universal.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asmar-chat-universal-apk
          path: build/app/outputs/flutter-apk/asmar-chat-universal.apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" build/app/outputs/flutter-apk/asmar-chat-universal.apk --title "Asmar Chat $TAG" --notes "Text + voice rooms only, no private calls" --prerelease
