name: Build Asmar Chat

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project
        run: |
          flutter create --platforms=android .
          ls -la android/app/
      - name: Force exact Android package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          candidates = [Path('android/app/build.gradle'), Path('android/app/build.gradle.kts'), Path('android/app/build.gradle.d')]
          gradle = next((p for p in candidates if p.is_file()), None)
          if gradle is None:
              raise SystemExit('Android Gradle file not found')
          s = gradle.read_text(encoding='utf-8')
          if gradle.suffix == '.kts':
              s, n = re.subn(r'applicationId\s*=\s*"[^"]+"', 'applicationId = "com.asmarchat.app"', s, count=1)
          else:
              s, n = re.subn(r'applicationId\s+["\'][^"\']+["\']', 'applicationId "com.asmarchat.app"', s, count=1)
          if n != 1:
              raise SystemExit(f'applicationId not found in {gradle}')
          gradle.write_text(s, encoding='utf-8')
          PY
      - name: Apply Asmar Chat logo and branding
        run: python3 tool/apply_branding.py
      - name: Set Android app display name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(); s,n=re.subn(r'(<application\b[^>]*\bandroid:label=")[^"]*(")',r'\1Asmar Chat\2',s,count=1)
          if n!=1: raise SystemExit('Could not set Android application label')
          p.write_text(s)
          PY
      - name: Configure Supabase Android callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text(); deep_link='''
            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="io.supabase.flutter" android:host="login-callback" />
            </intent-filter>'''
          if 'io.supabase.flutter' not in s:
              marker='</activity>'
              if marker not in s: raise SystemExit('Android activity block not found')
              s=s.replace(marker,deep_link+'\n '+marker,1); p.write_text(s)
          PY
      - name: Remove generated sample test
        run: rm -f test/widget_test.dart
      - name: Clean previous build outputs
        run: |
          flutter clean
          rm -rf build android/.gradle
      - name: Get dependencies
        run: flutter pub get
      - name: Apply release runtime fixes
        run: python3 tool/fix_release_runtime.py
      - name: Integrate global gift banner and admin threshold
        run: python3 tool/integrate_global_gift_bar.py
      # Room voice integration is temporarily disabled; LiveKit code remains unchanged.
      - name: Analyze
        id: analyze
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
      - name: Upload analyze log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asmar-chat-analyze-log
          path: analyze.log
          if-no-files-found: warn
      - name: Check native Google configuration
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: test -n "$GOOGLE_WEB_CLIENT_ID" || { echo "Missing repository variable GOOGLE_WEB_CLIENT_ID"; exit 1; }
      - name: Build universal APK
        env:
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
