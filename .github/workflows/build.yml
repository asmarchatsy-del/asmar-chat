name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تحميل المشروع
        uses: actions/checkout@v4

      - name: تثبيت Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: إنشاء ملفات Android إذا لزم
        run: |
          if [ ! -d "android" ]; then
            flutter create . --project-name asmar_chat --platforms=android
          fi

      - name: تثبيت الحزم
        run: flutter pub get

      - name: بناء APK
        run: flutter build apk --release

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: asmar-chat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
