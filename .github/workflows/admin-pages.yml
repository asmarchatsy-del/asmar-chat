name: Deploy Admin to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "admin/**"
      - ".github/workflows/admin-pages.yml"
      - "vercel.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          cp admin/index.html _site/index.html
          cp admin/app.js _site/app.js
          cp admin/style.css _site/style.css
          cp admin/badges.js _site/badges.js
          cp admin/gifts.js _site/gifts.js
          cp admin/rocket_levels.js _site/rocket_levels.js
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
