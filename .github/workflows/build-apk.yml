name: Build Asmar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.22.3
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release --dart-define=SUPABASE_URL=https://jojxsqsgmpaggfnnyuyy.supabase.co --dart-define=SUPABASE_ANON_KEY=sb_publishable_mC6rnw-HAwJzNu_2d-0A2g_SrEBWyjL

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asmar-chat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
