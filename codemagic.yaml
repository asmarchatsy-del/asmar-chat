workflows:
  android-fix:
    name: Fix V1 and Build APK
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Recreate Android with V2 embedding
        script: |
          rm -rf android
          flutter create . --platforms=android --project-name asmar_chat
          flutter pub get
      - name: Build APK Release
        script: |
          flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
