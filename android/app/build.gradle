plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.asmar.chat"
    compileSdk 34
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.asmar.chat"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // The CI release build must be installable as a normal APK.
    // A release APK without a signing configuration is unsigned and
    // Android may report it as an invalid package during installation.
    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

flutter {
    source "../.."
}
